# Duplication (copy-paste detection) only, not a full analysis exclusion — test files
# still get bugs/code-smell/security/coverage checks, just not flagged for
# duplication. Backend test setup (spinning up a throwaway admin, asserting a 401 on
# a missing auth header, a 404 on an unknown id, etc.) is deliberately repetitive
# across files: each test staying self-contained and readable in isolation matters
# more here than deduplicating it, unlike in application code.
sonar.cpd.exclusions=apps/backend/test/**
